name: Validate H5
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run text:check
      - run: npm run text:runtime
      - run: npm run text:review
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-text-review
          path: |
            docs/review/runtime-templates.csv
            docs/review/human-review-worklist.csv
          if-no-files-found: error
          retention-days: 14
      - name: Verify formal encounter transaction integrity
        run: npx vitest run tests/formal-world-encounter-2ag-c.test.js
      # Bound CPU-heavy fixed seed suites to avoid worker starvation.
      - run: npm test -- --maxWorkers=2
      - name: Compare automatic and manual encounter skill release
        run: npm run encounter:skill-release:check
      - name: Compare effective world levels in formal encounters
        run: npm run encounter:level-progression:check
      - name: Stress effective world levels with stationary and guarded objective play
        run: npm run encounter:level-pressure:check
      - run: npm run build
      - run: npm run balance:check
      - run: npm run balance:matrix:check
      - run: npm run compare:interventions:check
      - name: Compare permanent legacy doctrines with fixed seeds
        run: npm run legacy:balance:check
      - name: Validate opt-in sortie core loop with paired seeds
        run: npm run sortie:matrix:check

  mobile-e2e:
    name: Mobile E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Verify real mobile-viewport Chromium flows
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e-artifacts-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
