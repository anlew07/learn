name: Validate H5
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run text:check
      - run: npm run text:runtime
      - run: npm run text:review
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-text-review
          path: |
            docs/review/runtime-templates.csv
            docs/review/human-review-worklist.csv
          if-no-files-found: error
          retention-days: 14
      # Vitest 3.x fork workers intermittently emit "Timeout calling onTaskUpdate"
      # after all fixed-seed assertions pass. Keep the full suite, switch only
      # CI worker isolation/communication; do not skip or relax any test.
      - name: Run Vitest with thread workers
        run: npm test -- --pool=threads --maxWorkers=4
      - run: npm run build
      - run: npm run balance:check
      - run: npm run balance:matrix:check
      - run: npm run compare:interventions:check
      - name: Evaluate the isolated sortie core loop with paired fixed seeds
        run: npm run sortie:matrix:check
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Verify real mobile-viewport Chromium flows
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camp-ui-mobile-screenshots
          path: test-results/camp-ui/*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
