name: Bootstrap npm lockfile (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile using npm on the CI runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm npm can perform a frozen install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          test -f package-lock.json
          git diff --exit-code package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock exact npm dependency tree"
            git push origin HEAD:main
          fi
